<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src https://xqczjqonivguoeltskon.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer"><title>Waist Time test account setup</title>
<style>body{font:18px system-ui;max-width:560px;margin:48px auto;padding:0 24px;color:#26352b;background:#fafbf8}label{display:block;margin:16px 0}input,button{font:inherit;padding:12px;box-sizing:border-box}input{display:block;width:100%;margin-top:6px}button{cursor:pointer;margin:12px 8px 12px 0}img{max-width:260px}#status{min-height:60px}[hidden]{display:none}</style>
<h1>Test account setup</h1><p>Use only the fictional account approved for this beta.</p>
<p id="status" role="status">Test account setup is not enabled yet.</p>
<form id="password" hidden><label>Test email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password-value" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<form id="recover" hidden><button>Remove unfinished entry</button></form>
<form id="enroll" hidden><button>Create authenticator entry</button></form>
<form id="verify" hidden><img id="qr" alt="Authenticator enrollment QR code" hidden><label>Authenticator code<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><button>Verify code</button></form>
<form id="register" hidden><button>Create passkey</button></form>
<form id="signin" hidden><button>Verify new passkey</button></form>
<button id="stop" disabled>Stop setup</button><script type="module" src="./beta-enrollment.js?v=recovery-1"></script></html>
